<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axionpharma | online</title>
  <style>
    :root {
      /* PALETA MODERNA: PRETO ABSOLUTO, AZUL NEON E PRATA METÁLICO */
      --ink: #ffffff;
      --muted: #8a8a8a;
      --silver: #e0e0e0;
      --silver-gradient: linear-gradient(135deg, #ffffff 0%, #b0b0b0 100%);
      --line: #222222;
      --panel: rgba(20, 20, 20, 0.7);
      --bg-body: #050505;
      
      --blue: #00e5ff;
      --blue-dark: #00b8cc;
      --blue-glow: rgba(0, 229, 255, 0.15);
      
      --red: #ff4444; 
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-body);
      background-image: radial-gradient(circle at 50% -20%, rgba(0, 229, 255, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    /* ===== WHATSAPP FLUTUANTE ===== */
    .whatsapp-float {
      position: fixed; bottom: 28px; right: 28px; z-index: 100;
      width: 64px; height: 64px; border-radius: 50%;
      background: #25d366; color: #fff;
      box-shadow: 0 6px 24px rgba(37, 211, 102, .45);
      display: flex; align-items: center; justify-content: center;
      transition: transform .3s ease, box-shadow .3s ease; cursor: pointer; border: none;
    }
    .whatsapp-float:hover { transform: scale(1.1); box-shadow: 0 8px 32px rgba(37, 211, 102, .7); }
    .whatsapp-float svg { width: 36px; height: 36px; fill: #fff; }

    .wrap { width: min(1180px, calc(100% - 28px)); margin: 0 auto; }

    /* ===== HEADER ===== */
    .header-main, .section-head, .footer-grid {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
    }
    .header {
      position: sticky; top: 0; z-index: 20; 
      background: rgba(5, 5, 5, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .header-main { min-height: 100px; padding: 10px 0; flex-wrap: wrap; }

    .brand { display: flex; align-items: center; gap: 14px; min-width: 160px; flex: 1; cursor: pointer; }
    
    .brand-mark {
      width: 80px; height: 80px; border-radius: 12px; display: grid; place-items: center; overflow: hidden;
      background: #000;
      border: 1px solid rgba(0, 229, 255, 0.3);
      box-shadow: 0 0 20px var(--blue-glow); flex-shrink: 0;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
    
    .brand strong { 
      display: block; font-size: 38px; letter-spacing: -1.5px; line-height: 1; 
      background: var(--silver-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; letter-spacing: 1px; }

    .search {
      flex: 1; display: flex; min-width: 180px; max-width: 460px;
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius); overflow: hidden; background: rgba(20, 20, 20, 0.6);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .search:focus-within { border-color: var(--blue); box-shadow: 0 0 15px var(--blue-glow); }
    .search input { width: 100%; border: 0; outline: 0; padding: 12px 16px; font-size: 16px; color: #fff; background: transparent; }
    .search input::placeholder { color: #666; }
    .search button { width: 50px; border-radius: 0; background: var(--blue); color: #000; font-size: 20px; flex-shrink: 0; cursor: pointer; border: none; transition: background 0.2s; font-weight: bold; }
    .search button:hover { background: var(--blue-dark); }

    .cart-button {
      min-width: 140px; padding: 12px 16px; background: rgba(20, 20, 20, 0.8); color: var(--silver);
      border: 1px solid rgba(255, 255, 255, 0.1); font-weight: 700; font-size: 15px; flex-shrink: 0;
      position: relative; border-radius: var(--radius); cursor: pointer; transition: all 0.3s;
    }
    .cart-button:hover { border-color: var(--blue); color: #fff; box-shadow: 0 0 15px var(--blue-glow); }
    .cart-button .count {
      display: inline-grid; place-items: center; min-width: 26px; height: 26px;
      margin-left: 6px; border-radius: 999px; color: #000; background: var(--blue); font-size: 13px; font-weight: 900;
    }

    /* ===== TELA DE MARCAS (PASTAS) ===== */
    #brands-screen { display: block; padding: 40px 0; }
    
    .brand-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .brand-card {
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--radius);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .brand-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--blue), transparent);
      opacity: 0;
      transition: opacity 0.4s;
    }

    .brand-card:hover {
      border-color: rgba(0, 229, 255, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--blue-glow);
      transform: translateY(-5px);
      background: rgba(25, 25, 25, 0.8);
    }
    
    .brand-card:hover::before { opacity: 1; }

    /* ESTILO DA FOTO REDONDA (TIPO WHATSAPP) */
    .brand-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: all 0.4s;
      position: relative;
    }

    .brand-card:hover .brand-avatar {
      border-color: var(--blue);
      box-shadow: 0 0 20px var(--blue-glow);
    }

    .brand-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Fallback caso a imagem não exista: mostra as 4 letras */
    .brand-avatar .fallback-text {
      font-size: 20px;
      font-weight: 900;
      color: var(--silver);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .brand-card h3 { 
      margin: 0; font-size: 15px; color: var(--silver); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600;
      transition: color 0.4s;
    }
    .brand-card:hover h3 { color: #fff; }

    /* ===== VITRINE DE PRODUTOS ===== */
    .catalog-layout { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
    .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    
    .product-card { 
      display: flex; flex-direction: column; min-height: 330px; 
      background: var(--panel); 
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05); 
      border-radius: var(--radius); 
      overflow: hidden; 
      box-shadow: 0 8px 20px rgba(0, 0, 0, .3); 
      position: relative; 
      transition: all 0.3s;
    }
    .product-card:hover { border-color: var(--blue); box-shadow: 0 12px 30px rgba(0, 0, 0, .5), 0 0 15px var(--blue-glow); transform: translateY(-2px); }
    
    .product-id { position: absolute; top: 10px; left: 10px; background: rgba(0, 229, 255, 0.9); color: #000; font-size: 10px; font-weight: 900; padding: 2px 10px; border-radius: 999px; z-index: 15; font-family: monospace; }
    
    .product-art { position: relative; width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; background: #0a0a0a; border-bottom: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden; padding: 8px; flex-shrink: 0; cursor: pointer; }
    .product-art img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
    .product-art img:hover { transform: scale(1.08); }
    
    .badge { position: absolute; left: 10px; top: 10px; padding: 3px 10px; border-radius: 999px; color: #000; background: var(--blue); font-size: 10px; font-weight: 900; z-index: 10; }
    
    .product-body { display: flex; flex: 1; flex-direction: column; padding: 14px; position: relative; z-index: 1; min-height: 160px; }
    .product-category { color: var(--blue); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .product-card h3 { margin: 6px 0; min-height: 32px; font-size: 14px; line-height: 1.3; font-weight: 700; cursor: default; color: var(--silver); }
    .desc { min-height: 28px; margin: 0 0 8px; color: var(--muted); font-size: 12px; line-height: 1.4; cursor: default; }
    
    .price-row { margin-top: auto; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .old-price { color: #555; text-decoration: line-through; font-size: 12px; }
    .price { color: #fff; font-size: 22px; font-weight: 900; cursor: default; }
    
    .add-btn { 
      width: 100%; margin-top: 10px; padding: 10px; 
      background: transparent; 
      color: var(--blue); 
      font-weight: 900; font-size: 13px; 
      border: 1px solid var(--blue); 
      border-radius: var(--radius); 
      cursor: pointer; 
      transition: all 0.3s ease; 
      text-transform: uppercase; letter-spacing: 1px;
    }
    .add-btn:hover { background: var(--blue); color: #000; box-shadow: 0 0 15px var(--blue-glow); }

    .filter-reset-btn { display: none; padding: 8px 20px; background: transparent; color: var(--blue); border: 1px solid var(--blue); border-radius: var(--radius); font-weight: 700; cursor: pointer; font-size: 13px; transition: all 0.2s; margin-left: 10px; }
    .filter-reset-btn:hover { background: var(--blue); color: #000; box-shadow: 0 0 15px var(--blue-glow); }
    .filter-reset-btn.visible { display: inline-block; }

    /* ===== MODAIS E CARRINHO ===== */
    .modal-overlay { position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    .modal-overlay.active { display: flex; }
    .modal-box { background: #111; border-radius: var(--radius); padding: 30px; max-width: 500px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.9); position: relative; border: 1px solid rgba(255, 255, 255, 0.1); max-height: 90vh; overflow-y: auto; }
    .modal-box h3 { margin: 0 0 10px; color: #fff; font-size: 22px; }
    .modal-box .close-modal { position: absolute; top: 12px; right: 16px; font-size: 28px; cursor: pointer; border: none; background: none; color: var(--muted); transition: color 0.2s; }
    .modal-box .close-modal:hover { color: var(--blue); }
    .modal-box .subtitle { color: var(--muted); margin-bottom: 20px; font-size: 14px; }
    .modal-box label { display: block; font-weight: 700; margin-top: 16px; font-size: 14px; color: var(--silver); }
    .modal-box label .required { color: var(--red); margin-left: 4px; }
    .modal-box input { width: 100%; padding: 12px 14px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; font-size: 16px; margin-top: 4px; font-family: inherit; background: #0a0a0a; color: #fff; transition: border-color 0.3s; }
    .modal-box input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 10px var(--blue-glow); }
    .modal-box .modal-buttons { display: flex; gap: 10px; margin-top: 24px; }
    .modal-box .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: var(--radius); font-weight: 700; font-size: 16px; cursor: pointer; transition: all 0.2s ease; }
    .modal-box .btn-confirm { background: var(--blue); color: #000; }
    .modal-box .btn-confirm:hover { background: var(--blue-dark); box-shadow: 0 0 15px var(--blue-glow); }
    .modal-box .btn-cancel { background: transparent; border: 1px solid #444; color: #fff; }
    .modal-box .btn-cancel:hover { background: #222; }
    .modal-box .error-msg { color: var(--red); font-size: 13px; margin-top: 6px; display: none; }
    .modal-box .error-msg.visible { display: block; }

    .drawer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
    .drawer.open { pointer-events: auto; }
    .shade { position: absolute; inset: 0; background: rgba(0, 0, 0, .8); opacity: 0; transition: opacity .3s ease; backdrop-filter: blur(4px); }
    .drawer.open .shade { opacity: 1; }
    
    .cart-panel { 
      position: absolute; right: 0; top: 0; bottom: 0; width: min(400px, 100%); padding: 20px; 
      background: rgba(15, 15, 15, 0.95); 
      backdrop-filter: blur(20px);
      transform: translateX(102%); transition: transform .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      display: flex; flex-direction: column; box-shadow: -20px 0 40px rgba(0, 0, 0, .8); 
      border-left: 1px solid rgba(255, 255, 255, 0.05); 
    }
    .drawer.open .cart-panel { transform: translateX(0); }
    
    .cart-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .cart-head h2 { margin: 0; font-size: 20px; color: #fff; }
    .close-cart { width: 36px; height: 36px; border-radius: var(--radius); border: 1px solid rgba(255, 255, 255, 0.1); background: transparent; color: #fff; cursor: pointer; font-size: 20px; transition: all 0.2s; }
    .close-cart:hover { background: rgba(255, 255, 255, 0.1); color: var(--blue); }
    
    .cart-items { flex: 1; overflow: auto; padding: 10px 0; }
    .empty { padding: 30px 0; color: var(--muted); text-align: center; }
    .cart-line { display: grid; grid-template-columns: 50px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .cart-thumb { width: 50px; height: 50px; border-radius: 8px; display: grid; place-items: center; color: #000; background: var(--blue); font-weight: 800; font-size: 12px; overflow: hidden; }
    .cart-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .cart-line strong { display: block; font-size: 14px; line-height: 1.3; color: var(--silver); }
    .cart-line span { color: var(--muted); font-size: 12px; }
    
    .qty-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 28px; height: 28px; background: rgba(255, 255, 255, 0.05); color: var(--blue); font-weight: 900; font-size: 16px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .qty-btn:hover { background: rgba(0, 229, 255, 0.1); border-color: var(--blue); }
    
    .cart-total { padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
    .total-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; font-size: 18px; font-weight: 900; color: #fff; }
    
    .checkout { 
      width: 100%; padding: 14px; border: 0; border-radius: var(--radius); 
      background: var(--blue); color: #000; font-weight: 900; font-size: 16px; 
      cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;
    }
    .checkout:hover { background: var(--blue-dark); box-shadow: 0 0 20px var(--blue-glow); transform: translateY(-2px); }
    
    .coupon-section { margin: 12px 0 16px; padding: 12px; background: rgba(0, 0, 0, 0.4); border-radius: var(--radius); border: 1px dashed rgba(0, 229, 255, 0.3); }
    .coupon-section .coupon-input-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .coupon-section .coupon-input-group input { flex: 1; min-width: 120px; padding: 10px 12px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; font-size: 13px; outline: none; background: transparent; color: #fff; }
    .coupon-section .coupon-input-group input:focus { border-color: var(--blue); }
    .coupon-section .coupon-input-group button { padding: 10px 16px; background: transparent; color: var(--blue); border: 1px solid var(--blue); border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .coupon-section .coupon-input-group button:hover { background: var(--blue); color: #000; }
    .coupon-section .coupon-message { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 20px; }
    .coupon-section .coupon-message.success { color: var(--blue); }
    .coupon-section .coupon-message.error { color: var(--red); }

    .toast { position: fixed; left: 50%; bottom: 30px; z-index: 70; transform: translate(-50%, 110px); background: rgba(20, 20, 20, 0.95); color: #fff; border-radius: var(--radius); padding: 12px 20px; box-shadow: var(--shadow); transition: transform .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-weight: 700; font-size: 14px; text-align: center; max-width: 90%; border: 1px solid var(--blue); backdrop-filter: blur(10px); }
    .toast.show { transform: translate(-50%, 0); }

    footer { background: #000; color: var(--muted); padding: 30px 0; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .footer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; align-items: flex-start; }
    footer h3 { margin: 0 0 12px; color: var(--silver); font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }
    footer p, footer a, footer .contact-item { display: block; margin: 6px 0; color: #666; font-size: 13px; transition: color 0.2s; }
    footer a:hover { color: var(--blue); }
    .contact-item .label { color: var(--muted); }
    .contact-item .number { color: var(--silver); font-weight: 600; }

    @media (max-width: 1024px) {
      .product-grid { grid-template-columns: repeat(3, 1fr); }
      .footer-grid { grid-template-columns: repeat(2, 1fr); }
      .brand-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .header-main { flex-wrap: wrap; padding: 10px 0; gap: 10px; }
      .brand { min-width: 0; flex: 1; }
      .brand strong { font-size: 28px; }
      .brand-mark { width: 60px; height: 60px; }
      .search { order: 3; max-width: none; flex-basis: 100%; min-width: 0; }
      .cart-button { min-width: auto; padding: 10px 14px; font-size: 13px; }
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .footer-grid { grid-template-columns: 1fr; gap: 16px; }
      .whatsapp-float { width: 56px; height: 56px; bottom: 20px; right: 20px; }
      .brand-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } 
      .brand-card { padding: 20px 10px; }
      .brand-avatar { width: 60px; height: 60px; }
      .brand-card h3 { font-size: 12px; }
    }

    @media (max-width: 480px) {
      .brand strong { font-size: 22px; }
      .brand-mark { width: 50px; height: 50px; }
      .product-grid { grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
      .product-card { min-height: 220px !important; }
      .product-art { height: 110px !important; }
    }
  </style>
</head>
<body>

  <!-- WHATSAPP FLUTUANTE -->
